[functions.handle-email-unsubscribe]
verify_jwt = false

[functions.handle-email-suppression]
verify_jwt = false

[functions.send-mfa-code]
# Gateway JWT check disabled because the browser CORS preflight (OPTIONS)
# doesn't carry the Authorization header — Supabase's gateway returns 401
# on the preflight, browser blocks the real POST. The function does its
# own JWT verification via auth.getUser(jwt) before any work runs, so this
# is safe.
verify_jwt = false

[functions.verify-mfa-code]
# Same reason — function-internal JWT verification is in place.
verify_jwt = false

[functions.github-discovery]
# One-shot discovery — invoked from the browser console or SQL editor.
# Reads PAT from connector_credentials server-side, never accepts it
# from the request body, so it's safe to expose without JWT auth.
verify_jwt = false

[functions.youtube-discovery]
# Same pattern as github-discovery — API key read from connector_credentials,
# never from request body. Safe to expose without JWT.
verify_jwt = false

[functions.youtube-sync]
# Same.
verify_jwt = false

[functions.youtube-oauth-start]
# Generates Google consent URL — invoked from frontend; doesn't touch
# any user-supplied secrets, only reads from Supabase env vars.
verify_jwt = false

[functions.youtube-oauth-callback]
# Receives Google's redirect — Google won't include a JWT.
verify_jwt = false

[functions.youtube-analytics-sync]
# Reads OAuth tokens server-side from connector_youtube_oauth.
verify_jwt = false

[functions.youtube-kai-ask]
# Aggregates YouTube data server-side via service role and calls the
# Lovable AI gateway. No user-supplied secrets. Dashboard access is
# already RLS-gated upstream (founder + social media lead only).
verify_jwt = false

[functions.slack-sync]
# Reads SLACK_BOT_TOKEN from secrets, fetches workspace/channel/user data
# from the Slack Web API, and upserts into analytics tables.
verify_jwt = false

[functions.slack-kai-ask]
# Aggregates Slack analytics via service role and calls the Lovable AI
# gateway. Same access pattern as youtube-kai-ask.
verify_jwt = false

[functions.slack-presence]
# Reads the synced roster and calls Slack users.getPresence for live
# online/away status. Token read from secrets server-side.
verify_jwt = false

[functions.github-sync]
# Reads the GitHub PAT from connector_credentials server-side and pulls
# commits/PRs/issues into connector_data_github(+_daily). No user secrets in
# the request body.
verify_jwt = false

[functions.github-kai-ask]
